[project]
name = "backend"
version = "0.1.0"
description = "Market simulation backend: LOB matching engine, RL agent pool, data ingestion pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "redis>=5.2",
    "asyncpg>=0.30",
    "numpy>=2.1",
    "pandas>=2.2",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "alpaca-py>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]
